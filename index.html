<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dilemma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <p class="eerie-text">
            if more than 50% choose blue, everyone survives.<br>
            if less than 50% choose blue, only those who chose red survive.
        </p>

        <div class="button-container">
            <button id="red-btn" class="img-btn"><img src="red.png" alt="red"></button>
            <button id="blue-btn" class="img-btn"><img src="blue.png" alt="blue"></button>
        </div>

        <div id="results-panel" class="results hidden">
            <p>red: <span id="red-count">0</span> (<span id="red-percent">0%</span>)</p>
            <p>blue: <span id="blue-count">0</span> (<span id="blue-percent">0%</span>)</p>
            <p id="status-message" class="status-message"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
