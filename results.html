<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>results</title>
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'VCR OSD Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .stats { font-size: 32px; line-height: 2; }
        .red { color: #b32424; }
        .blue { color: #3b68b8; }
        .status { margin-top: 50px; font-size: 24px; opacity: 0.7; }
        button {
            margin-top: 50px;
            background: none;
            border: 1px solid #fff;
            color: #fff;
            font-family: inherit;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="stats">
        <div>RED: <span id="red-count" class="red">...</span> (<span id="red-percent">0%</span>)</div>
        <div>BLUE: <span id="blue-count" class="blue">...</span> (<span id="blue-percent">0%</span>)</div>
    </div>
    <div id="status" class="status">fetching fate...</div>
    
    <button onclick="location.reload()">REFRESH</button>

    <script>
        const NAMESPACE = 'viral_button_dilemma_luna_2026';
        const API_BASE = 'https://api.counterapi.dev/v1';

        async function fetchCount(key) {
            try {
                const response = await fetch(`${API_BASE}/${NAMESPACE}/${key}/`);
                if (!response.ok) return 0;
                const data = await response.json();
                return data.count || 0;
            } catch (e) { return 0; }
        }

        async function update() {
            const red = await fetchCount('red_votes');
            const blue = await fetchCount('blue_votes');
            const total = red + blue;

            document.getElementById('red-count').innerText = red;
            document.getElementById('blue-count').innerText = blue;

            if (total > 0) {
                const redP = (red / total * 100).toFixed(1);
                const blueP = (blue / total * 100).toFixed(1);
                document.getElementById('red-percent').innerText = redP + '%';
                document.getElementById('blue-percent').innerText = blueP + '%';

                if (blueP > 50) {
                    document.getElementById('status').innerText = 'STATUS: HUMANITY SURVIVES';
                } else {
                    document.getElementById('status').innerText = 'STATUS: ONLY RED SURVIVES';
                }
            }
        }

        update();
    </script>
</body>
</html>
